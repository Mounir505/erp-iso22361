# Dashboard (conscience partagée de crise) — port 8501 (livrable 3.1)
server {
    listen 8501;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # API métier + contrat de supervision relayés vers erp-core (même origine : pas de CORS)
    location ~ ^/(api|health|events|status)(/|$) {
        proxy_pass http://erp-core:8000;
        # Host avec le port : Spring reconnaît la requête comme « même origine » (sinon CORS → 403)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Journal JSON partagé (alternative « fichier » du contrat 2.4), en lecture seule
    location = /logs/events.log {
        alias /var/log/erp/events.log;
        default_type application/x-ndjson;
        add_header Cache-Control no-store;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application monopage
    location / {
        try_files $uri /index.html;
    }
}
